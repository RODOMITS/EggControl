<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1221"><title>Egg Control</title><link rel="icon" href="/static/game.webp"><link rel="stylesheet" href="/static/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/static/app.js" defer></script></head><body>
<div id="gate"><div class="gate-card"><img src="/static/game.webp" alt="Игра"><h1>Egg Control</h1><p id="gateText">Вход через Telegram</p><span data-icon="shield"></span></div></div>
<div id="shell" hidden><aside class="sidebar"><a class="brand" href="#"><img src="/static/game.webp" alt=""><div>Egg Control</div></a><nav><button data-tab="overview" class="active"><span data-icon="grid"></span><span>Обзор</span></button><button data-tab="exists"><span data-icon="egg"></span><span>Экзисты</span></button><button data-tab="players"><span data-icon="users"></span><span>Игроки</span></button><button data-tab="admin" class="admin-only"><span data-icon="sliders"></span><span>Команды</span></button></nav><div class="side-footer"><span data-icon="shield"></span><div id="roleLabel"></div><button id="logout" aria-label="Выйти"><span data-icon="logout"></span></button></div></aside>
<main><header><span id="breadcrumb">Обзор</span><div class="account"><span id="accountName"></span><span class="avatar" id="avatar"></span></div></header>
<section id="overview" class="page"><div class="page-head"><h1>Обзор</h1><button class="secondary refresh" aria-label="Обновить"><span data-icon="refresh"></span></button></div><div id="connection" class="connection"></div><div class="metrics"><article><span data-icon="users"></span><p>Онлайн</p><strong id="online">—</strong></article><article><span data-icon="server"></span><p>Серверы</p><strong id="servers">—</strong></article><article><span data-icon="egg"></span><p>Петов в мире</p><strong id="total">—</strong></article></div><div class="overview-links"><button class="panel shortcut" data-open="exists"><span data-icon="egg"></span><div>Экзисты</div><span data-icon="arrow"></span></button><button class="panel shortcut" data-open="players"><span data-icon="users"></span><div>Игроки</div><span data-icon="arrow"></span></button></div><p id="updated" class="subtle"></p></section>
<section id="exists" class="page" hidden><div class="page-head"><h1>Экзисты</h1><span class="pill" id="catalogSize"></span></div><div class="toolbar"><label class="search"><span data-icon="search"></span><input id="petSearch" placeholder="Поиск пета" aria-label="Поиск пета"></label><select id="sort" aria-label="Сортировка"><option value="rare">По редкости</option><option value="name">По названию</option><option value="income">По доходу</option></select></div><div class="chips" id="mutations"></div><div id="existsHint" class="subtle"></div><div id="petGrid" class="pet-grid"></div></section>
<section id="players" class="page" hidden><div class="page-head"><h1>Игроки</h1><button class="secondary refresh" aria-label="Обновить"><span data-icon="refresh"></span></button></div><label class="search"><span data-icon="search"></span><input id="playerSearch" placeholder="Ник или ID" aria-label="Поиск игрока"></label><div id="playerList" class="player-list"></div></section>
<section id="admin" class="page" hidden><div class="page-head"><h1>Команды</h1><span id="commandCount" class="pill"></span></div><div id="apiStatus" class="connection"></div><div class="admin-grid"><article class="panel"><form id="commandForm"><label>Команда<select id="commandAction"></select></label><code id="commandName"></code><label id="targetLabel">Игрок<input id="commandTarget" list="onlineNames" placeholder="Полный ник или Roblox ID" autocomplete="off"></label><datalist id="onlineNames"></datalist><div id="commandFields"></div><button class="primary" type="submit"><span data-icon="send"></span>Выполнить</button></form></article><article class="panel"><h2>Доступ КК</h2><form id="creatorForm"><label>Telegram ID<input id="creatorId" inputmode="numeric" pattern="[0-9]+" required></label><label>Имя<input id="creatorLabel" maxlength="60" required></label><button class="secondary" type="submit"><span data-icon="plus"></span>Добавить</button></form><div id="creatorList"></div></article></div><article class="panel history"><h2>Журнал</h2><div id="commandHistory"></div></article></section>
</main></div><dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialog-actions"><button class="secondary" id="cancelConfirm">Отмена</button><button class="primary" id="acceptConfirm">Выполнить</button></div></dialog><dialog id="diagnosticDialog"><h2>Подключение</h2><pre id="diagnosticResult"></pre><button class="secondary" id="closeDiagnostics">Закрыть</button></dialog><div id="toast" role="status"></div></body></html>
